<!doctype html>
<html lang="ru" class="is-preloading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171719" />
    <meta name="description" content="Бренд-маркетолог: исследование, стратегия, креатив, реализация и аналитика. Запуск и развитие бизнеса." />
    <title>Бренд-маркетолог · Стратегия и реализация</title>
    <style>
      html.is-preloading, html.is-preloading body { overflow: hidden; }
      html.is-preloading:not(.is-preloader-exiting) #app { visibility: hidden; }
      .preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #f2eee7;
        opacity: 1;
        transition: opacity 480ms ease;
      }
      .preloader__mark {
        display: block;
        width: min(82vw, 70vh, 560px);
        max-width: 100%;
        height: auto;
        aspect-ratio: 480 / 480;
        overflow: visible;
        color: #e50914;
      }
      .preloader__line {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
      }
      .preloader__loop { stroke-width: 8; animation: draw-ink 1050ms cubic-bezier(.45, 0, .28, 1) 50ms forwards; }
      .preloader__stem { stroke-width: 13; animation: draw-ink 800ms cubic-bezier(.48, 0, .23, 1) 1100ms forwards; }
      .preloader__sweep { stroke-width: 13; animation: draw-ink 600ms cubic-bezier(.4, 0, .2, 1) 1900ms forwards; }
      .preloader__fill { fill: currentColor; opacity: 0; animation: reveal-ink 250ms ease 2500ms forwards; }
      .is-preloader-exiting .preloader { opacity: 0; pointer-events: none; }
      @keyframes draw-ink { to { stroke-dashoffset: 0; } }
      @keyframes reveal-ink { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .preloader { transition: none; }
        .preloader__line { animation: none; stroke-dashoffset: 0; }
        .preloader__fill { animation: none; opacity: 1; }
      }
    </style>
    <noscript><style>.preloader { display: none; } html.is-preloading, html.is-preloading body { overflow: auto; } html.is-preloading #app { visibility: visible; }</style></noscript>
  </head>
  <body>
    <div class="preloader" id="preloader" role="status" aria-label="Загрузка сайта">
      <svg class="preloader__mark" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path class="preloader__line preloader__loop" pathLength="100" d="M 286 294 C 243 302 202 328 176 364 C 159 387 158 400 167 391 C 186 370 193 340 191 312 C 187 270 172 247 149 250 C 101 255 48 321 32 376 C 16 429 38 464 77 471 C 136 482 202 440 257 383 C 317 322 380 225 420 117 C 436 75 446 57 450 62" />
        <path class="preloader__line preloader__stem" pathLength="100" d="M 450 62 C 427 137 389 236 357 312 C 338 360 324 420 317 447 C 313 455 314 421 312 408 C 310 394 302 389 278 389 C 245 389 208 395 185 396" />
        <path class="preloader__line preloader__sweep" pathLength="100" d="M 286 294 C 230 307 187 350 164 391 C 157 404 171 399 186 389 C 221 361 285 332 356 307 C 411 287 452 276 472 271" />
        <path class="preloader__fill" fill-rule="evenodd" d="M 450 60 C 461 53 456 82 451 103 C 436 169 410 217 370 256 C 359 267 348 267 348 254 C 348 249 354 246 359 241 C 397 203 424 108 442 68 C 444 63 447 61 450 60 Z M 446 82 C 439 119 411 190 380 230 C 409 172 433 110 446 82 Z" />
      </svg>
    </div>
    <div id="app"></div>
    <script>
      (() => {
        const root = document.documentElement;
        const preloader = document.getElementById('preloader');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let pageLoaded = document.readyState === 'complete';
        let logoFinished = reducedMotion;
        let exiting = false;

        function finish() {
          if (!pageLoaded || !logoFinished || exiting || !preloader) return;
          exiting = true;
          root.classList.add('is-preloader-exiting');
          const remove = () => {
            preloader.remove();
            root.classList.remove('is-preloading', 'is-preloader-exiting');
          };
          if (reducedMotion) remove();
          else {
            preloader.addEventListener('transitionend', remove, { once: true });
            setTimeout(remove, 600);
          }
        }

        if (!pageLoaded) addEventListener('load', () => { pageLoaded = true; finish(); }, { once: true });
        if (!logoFinished) {
          preloader?.querySelector('.preloader__fill')?.addEventListener('animationend', () => { logoFinished = true; finish(); }, { once: true });
          setTimeout(() => { logoFinished = true; finish(); }, 3200);
        }
        finish();
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
